<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Forces the mouse to pass straight through the popup */
        .ghost-popup {
            pointer-events: none !important;
        }

        /* Reset default margins and set full height for the page layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Main application wrapper, using flexbox to position map and sidebar side-by-side */
        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* The Leaflet map container, flex-grow allows it to take up remaining space */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Fixed-width sidebar for controls and activity list */
        #sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            z-index: 1000; /* Keeps it above the Leaflet map */
        }

        /* Sidebar header containing filters and search, pinned to the top */
        .sidebar-header {
            padding: 15px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0; /* Prevents the header from getting crushed when the list is long */
        }
        
        /* Button to toggle the visibility of map filters */
        #filter-toggle-btn {
            width: 100%;
            padding: 8px 12px;
            margin-top: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        #filter-toggle-btn:hover {
            background-color: #e9ecef;
        }
        
        /* Row layout for individual filter checkboxes and color pickers */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        /* Minimal styling for color pickers */
        .filter-row input[type="color"] {
            border: none;
            width: 20px;
            height: 24px;
            padding: 0;
            cursor: pointer;
            background: transparent;
        }
        
        /* Container for all sport-specific filters (hidden by default) */
        .sport-filters {
            display: none; 
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 13px;
            color: #444;
        }
        
        /* Styling for text search box and year selection dropdown */
        #search-box, #year-select {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Label alignment for filter checkboxes */
        .sport-filters label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* Scrollable container for the list of activities */
        #activity-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        /* Individual activity card styling */
        .activity-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .activity-item:hover {
            background: #e9ecef;
        }

        /* Activity title */
        .activity-item h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #333;
        }

        /* Activity type and date subtitle */
        .activity-item p {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #555;
        }

        /* Layout for primary activity stats (distance, time, pace) */
        .activity-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #222;
        }

        /* Container for a single stat label and value */
        .stat-box {
            display: flex;
            flex-direction: column;
        }

        /* Label for an individual stat */
        .stat-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        /* ==========================================
           MOBILE RESPONSIVENESS
           ========================================== */
        @media (max-width: 768px) {
            #app-container {
                flex-direction: column;
                height: 100dvh; 
            }
            
            #map {
                width: 100%;
                flex: 0 0 50%; 
            }

            #sidebar {
                width: 100%;
                flex: 1; 
                height: auto; 
                border-left: none;
                border-top: 2px solid #ccc;
                overflow: hidden; 
            }
        }
    </style>
</head>
<body>

<!-- Main application wrapper -->
<div id="app-container">
    <!-- Map container -->
    <div id="map"></div>
    
    <!-- Sidebar for controls and activity list -->
    <div id="sidebar">
        <!-- Static header section containing filters -->
        <div class="sidebar-header">
            <!-- Year filter dropdown -->
            <select id="year-select" onchange="filterMapByYear()">
                <option value="ALL">Show All Years</option>
            </select>
            
            <!-- Text search for activities -->
            <input type="text" id="search-box" placeholder="Search activities..." onkeyup="debouncedFilterSidebar()">
            
            <!-- Toggle button for expanding/collapsing map filters -->
            <button id="filter-toggle-btn" onclick="toggleFilters()">
                Map Filters <span id="filter-icon">▼</span>
            </button>
            
            <!-- Container for filtering options (initially hidden) -->
            <div class="sport-filters" id="filter-container">
                <!-- Broad category filters (Cycling, Pavement, Dirt, etc.) -->
                <div style="width: 100%; margin-bottom: 5px;"><strong>Category Filters</strong></div>
                <div class="filter-row">
                    <input type="checkbox" id="filter-cycling" value="Cycling" checked onchange="resetDropdownAndFilter()">
                    <input type="color" id="color-cycling" value="#fc4c02" onchange="updateSportColor('Cycling', this.value)">
                    <label for="filter-cycling">Cycling</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="filter-pavement" value="Pavement" onchange="resetDropdownAndFilter()">
                    <input type="color" id="color-pavement" value="#007fb6" onchange="updateSportColor('Pavement', this.value)">
                    <label for="filter-pavement">Pavement</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="filter-dirt" value="Dirt" onchange="resetDropdownAndFilter()">
                    <input type="color" id="color-dirt" value="#8b4513" onchange="updateSportColor('Dirt', this.value)">
                    <label for="filter-dirt">Dirt</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="filter-swim" value="Swim" onchange="resetDropdownAndFilter()">
                    <input type="color" id="color-swim" value="#00b300" onchange="updateSportColor('Swim', this.value)">
                    <label for="filter-swim">Swimming</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="filter-other" value="Other" onchange="resetDropdownAndFilter()">
                    <input type="color" id="color-other" value="#666666" onchange="updateSportColor('Other', this.value)">
                    <label for="filter-other">Other</label>
                </div>
                
                <div style="width: 100%; height: 1px; background: #ddd; margin: 5px 0;"></div>
                
                <!-- Scrollable Specific Sport Box -->
                <div style="width: 100%; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
                    <strong>Specific Sport Override</strong>
                    <!-- The master color picker for specific sports -->
                    <input type="color" id="color-specific" value="#e83e8c" onchange="updateSpecificSportColor(this.value)" style="border: none; width: 20px; height: 24px; padding: 0; cursor: pointer; background: transparent;">
                </div>
                <!-- Container for dynamically injected specific sport checkboxes -->
                <div id="specific-sport-list" style="width: 100%; max-height: 120px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; padding: 5px; background: #fff; box-sizing: border-box; font-size: 12px;">
                    <!-- JavaScript will inject the checkboxes here -->
                </div>

                <div style="width: 100%; height: 1px; background: #ddd; margin: 5px 0;"></div>
                
                <!-- Grid tile overlays (Squadrats) -->
                <label style="display:flex; gap:4px;"><input type="checkbox" id="filter-squadrats" onchange="drawTileGrid()"> Squadrats (14)</label>
                <label style="display:flex; gap:4px;"><input type="checkbox" id="filter-squadratinhos" onchange="drawTileGrid()"> Squadratinhos (17)</label>
            </div>
        </div>
        
        <!-- Scrollable container for the dynamic list of activity items -->
        <div id="activity-list"></div>
    </div>
</div>

<!-- Leaflet & Supabase JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://tmtqyawzmmjfydxoymry.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cMso9XTCykk7W2BYWxAGPw_xzxHCufa';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Popup configuration used for hover clusters (non-interactive)
    const clusterPopup = L.popup({ 
        autoPan: false, 
        closeButton: false, 
        className: 'ghost-popup',
        offset: [0, -15] 
    });

    // ==========================================
    // 2. MAP SETUP
    // ==========================================
    // Initialize Leaflet map, centered roughly on Buffalo, NY
    const map = L.map('map').setView([42.8864, -78.8784], 10); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);

    // Grouping layers by sport category for easy batch toggling
    window.sportGroups = {
        Cycling: L.featureGroup().addTo(map), 
        Pavement: L.featureGroup().addTo(map),
        Dirt: L.featureGroup().addTo(map),
        Swim: L.featureGroup().addTo(map),
        Other: L.featureGroup().addTo(map)
    };

    let gridLayerGroup = L.featureGroup().addTo(map);
    let runningMapLines = [];
    const visitedTiles = new Set();

    // ==========================================
    // CLUSTER TRACKING & HIGHLIGHTING
    // ==========================================
    // State variables for managing selected and highlighted lines
    let selectedActivityIds = null; 
    let activeHoverLines = [];
    let highlightedLines = []; 

   // Resets the map styling for any lines that were currently highlighted
   function clearMapHighlights() {
        const specificSports = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        const specificColor = document.getElementById('color-specific').value;

        highlightedLines.forEach(l => {
            if (l.activityData) {
                const type = l.activityData.type;
                let restoreColor = getSportConfig(type).color;
                
                // If this sport is selected in the specific list, restore to the custom color instead
                if (specificSports.length > 0 && specificSports.includes(type)) {
                    restoreColor = specificColor;
                }
                
                // Revert to original unhighlighted state
                l.setStyle({ color: restoreColor, weight: 4, opacity: 0.30 });
            }
        });
        highlightedLines = []; 
    }

    // Map click handler to select a specific cluster of lines
    map.on('click', function(e) {
        // Find lines within a short pixel distance from the click
        const cluster = getOverlappingLines(e.latlng, 15);
        
        if (cluster.length > 0) {
            // Isolate map to show only clicked activities
            selectedActivityIds = cluster.map(l => String(l.activityData.id));
            document.getElementById('search-box').placeholder = `Filtered to ${cluster.length} activities (Click empty map to clear)`;
            
            // Scroll to the top of the sidebar
            document.getElementById('activity-list').scrollTop = 0;
            
            // Expand the extended stats section for clicked activities in the sidebar
            document.querySelectorAll('.extended-stats').forEach(el => el.style.display = 'none');
            selectedActivityIds.forEach(id => {
                const card = document.getElementById(`sidebar-item-${id}`);
                if (card) card.querySelector('.extended-stats').style.display = 'block';
            });
            
        } else {
            // If click is empty, reset view to all activities
            selectedActivityIds = null;
            document.getElementById('search-box').placeholder = "Search activities...";
        }
        // Apply the new visual state
        filterSidebar();
    });
    
    // Maps a specific sport type string to its corresponding category color and layer group
    function getSportConfig(type) {
        if (type.includes('Ride') || type.includes('VirtualRide') || type.includes('EBike')) return { color: document.getElementById('color-cycling').value, group: window.sportGroups.Cycling };
        if (type === 'Run' || type === 'Walk') return { color: document.getElementById('color-pavement').value, group: window.sportGroups.Pavement };
        if (type === 'Hike' || type === 'TrailRun') return { color: document.getElementById('color-dirt').value, group: window.sportGroups.Dirt };
        if (type.includes('Swim')) return { color: document.getElementById('color-swim').value, group: window.sportGroups.Swim };
        
        return { color: document.getElementById('color-other').value, group: window.sportGroups.Other };
    }

    // ==========================================
    // 3. TILE GRID LOGIC
    // ==========================================
    function drawGridForZoom(targetZoom, bounds, baseColor) {
        if (map.getZoom() < 10) return;
        const nwPoint = map.project(bounds.getNorthWest(), targetZoom);
        const sePoint = map.project(bounds.getSouthEast(), targetZoom);
        
        const minX = Math.floor(nwPoint.x / 256);
        const maxX = Math.floor(sePoint.x / 256);
        const minY = Math.floor(nwPoint.y / 256);
        const maxY = Math.floor(sePoint.y / 256);

        const totalTiles = (maxX - minX + 1) * (maxY - minY + 1);
        if (totalTiles > 5000) {
            console.log(`Skipping zoom ${targetZoom} grid: too many tiles (${totalTiles}). Zoom in closer!`);
            return; 
        }

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                const tileNw = map.unproject(L.point(x * 256, y * 256), targetZoom);
                const tileSe = map.unproject(L.point((x + 1) * 256, (y + 1) * 256), targetZoom);
                
                const tileKey = `${targetZoom}_${x}_${y}`;
                const isVisited = visitedTiles.has(tileKey);

                const currentStyle = { 
                    color: baseColor, 
                    weight: 1, 
                    opacity: 0.3,      
                    fillOpacity: 0, 
                    interactive: false 
                };

                if (isVisited) {
                    currentStyle.fillColor = baseColor;
                    currentStyle.fillOpacity = 0.2; 
                }
                
                L.rectangle(L.latLngBounds(tileNw, tileSe), currentStyle).addTo(gridLayerGroup);
            }
        }
    }

    function drawTileGrid() {
        gridLayerGroup.clearLayers();
        const bounds = map.getBounds();

        const show14 = document.getElementById('filter-squadrats').checked;
        const show17 = document.getElementById('filter-squadratinhos').checked;

        if (show14) {
            drawGridForZoom(14, bounds, "#ff7800"); 
        }
        if (show17) {
            drawGridForZoom(17, bounds, "#0066ff"); 
        }
    }

    map.on('moveend', drawTileGrid);

    // ==========================================
    // 4. DATA LOADING & UI
    // ==========================================

    // SPATIAL SEARCH: Given a lat/lng, find all lines on the map that intersect within a specific pixel tolerance
    function getOverlappingLines(latlng, tolerancePixels = 10) {
        // Project map coordinates into pixels for distance calculation
        const point = map.project(latlng);
        const matches = [];
        
        runningMapLines.forEach(line => {
            if (!map.hasLayer(line)) return; 
            
            // Fast bounding box check to exclude lines far away
            const bounds = line.getBounds();
            if (!bounds.isValid() || !bounds.pad(0.01).contains(latlng)) return; 
            
            // Detailed segment-by-segment check if inside bounding box
            const coords = line.getLatLngs();
            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = map.project(coords[i]);
                const p2 = map.project(coords[i+1]);
                if (L.LineUtil.pointToSegmentDistance(point, p1, p2) <= tolerancePixels) {
                    matches.push(line);
                    break; 
                }
            }
        });
        return matches;
    }
    
    // Fetch unique years from Supabase to populate the filtering dropdown
    async function initDropdown() {
        let allYears = [];
        let start = 0;
        const chunkSize = 1000;

        while (true) {
            const { data, error } = await _supabase.from('activities').select('year').range(start, start + chunkSize - 1);
            if (error || !data || data.length === 0) break;
            
            allYears.push(...data.map(item => item.year));
            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        const uniqueYears = [...new Set(allYears)].sort((a, b) => b - a);
        const dropdown = document.getElementById('year-select');
        
        uniqueYears.forEach(year => {
            if (year > 0) {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                dropdown.appendChild(opt);
            }
        });
        
        loadData("ALL");
    }
    
    initDropdown();

    // Safely load ALL map data
    async function loadData(targetYear) {
        runningMapLines.forEach(line => line.remove());
        runningMapLines = [];
        visitedTiles.clear();
        
        const listContainer = document.getElementById('activity-list');
        listContainer.innerHTML = '';
        
        let activities = [];
        let start = 0;
        const chunkSize = 1000;

        while (true) {
            let query = _supabase.from('activities').select('*').range(start, start + chunkSize - 1);
            if (targetYear !== "ALL") {
                query = query.eq('year', parseInt(targetYear));
            }

            const { data, error } = await query;
            if (error) { console.error("Database query failed:", error); break; }
            if (!data || data.length === 0) break;

            activities.push(...data);
            
            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        // Sort Newest First
        activities.sort((a, b) => {
            const dateA = new Date(a.start_date || a.year);
            const dateB = new Date(b.start_date || b.year);
            return dateB - dateA;
        });

        // =========================================================
        // BUILD DYNAMIC SCROLLABLE CHECKBOXES
        // Populate the Specific Sport Override filter box with all discovered types
        // =========================================================
        const uniqueTypes = [...new Set(activities.map(a => a.type))].sort();
        const specificListContainer = document.getElementById('specific-sport-list');
        specificListContainer.innerHTML = ''; 

        uniqueTypes.forEach(type => {
            const lbl = document.createElement('label');
            lbl.style.display = 'block'; 
            lbl.style.marginBottom = '4px';
            lbl.style.cursor = 'pointer';
            
            lbl.innerHTML = `<input type="checkbox" class="specific-type-cb" value="${type}" onchange="clearCheckboxesAndFilter()"> ${type}`;
            specificListContainer.appendChild(lbl);
        });
        // =========================================================

        const allPolylines = [];

        activities.forEach(activity => {
            if (activity.type === 'VirtualRide') return;
            if (!activity.coordinates || activity.coordinates.length === 0) return;

            if (activity.visited_tiles) {
                activity.visited_tiles.forEach(tile => visitedTiles.add(tile));
            }

            const config = getSportConfig(activity.type);
            const line = L.polyline(activity.coordinates, {
                color: config.color,
                weight: 4,          
                opacity: 0.3,      
                smoothFactor: 1
            });
           
            line.sportType = activity.type; 

            let dateStr = activity.year;
            if (activity.start_date) {
                const d = new Date(activity.start_date);
                dateStr = d.toLocaleDateString(undefined, { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
            }

            line.activityData = activity;
            line.addTo(config.group);
            
            // CLUSTER HOVER
            line.on('mouseover', function (e) {
                clearMapHighlights(); 
                
                const cluster = getOverlappingLines(e.latlng, 10);
                cluster.sort((a, b) => new Date(b.activityData.start_date || b.activityData.year) - new Date(a.activityData.start_date || a.activityData.year));
                
                let html = '<div style="font-family: Arial; text-align: left; max-height: 200px; overflow-y: auto;">';
                
                cluster.forEach((l, index) => {
                    l.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                    l.bringToFront();
                    highlightedLines.push(l); 
                    
                    if (index < 5) {
                        const act = l.activityData;
                        const dStr = act.start_date ? new Date(act.start_date).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric', year: 'numeric' }) : act.year;
                        
                        html += `<div style="margin-bottom: 3px;">
                                    <a href="https://intervals.icu/activities/${act.id}" target="_blank" style="text-decoration: none; color: #333; font-size: 13px;">
                                        ${act.name} (${dStr})
                                    </a>
                                 </div>`;
                    }
                });
                
                if (cluster.length > 5) {
                    html += `<div style="font-size: 11px; color: #888; margin-top: 4px;">... and ${cluster.length - 5} more</div>`;
                }
                html += '</div>';
                
                clusterPopup.setLatLng(e.latlng).setContent(html).openOn(map);
            });

            // UN-HOVER
            line.on('mouseout', function () {
                clearMapHighlights();
            });

            // DESKTOP LINE CLICK FIX
            line.on('click', function (e) {
                const cluster = getOverlappingLines(e.latlng, 15);
                
                if (cluster.length > 0) {
                    selectedActivityIds = cluster.map(l => String(l.activityData.id));
                    document.getElementById('search-box').placeholder = `Filtered to ${cluster.length} activities (Click empty map to clear)`;
                    
                    document.getElementById('activity-list').scrollTop = 0;
                    
                    document.querySelectorAll('.extended-stats').forEach(el => el.style.display = 'none');
                    selectedActivityIds.forEach(id => {
                        const card = document.getElementById(`sidebar-item-${id}`);
                        if (card) card.querySelector('.extended-stats').style.display = 'block';
                    });
                    
                    filterSidebar();
                }
                L.DomEvent.stopPropagation(e); 
            });
                 
            runningMapLines.push(line);
            allPolylines.push(line);

            // Calculate Sidebar Metrics
            const raw = activity.raw_data || {};
            const distanceMiles = raw.distance ? (raw.distance / 1609.34) : 0;
            const distStr = distanceMiles > 0 ? distanceMiles.toFixed(2) + ' mi' : '--';

            const timeSecs = raw.moving_time || raw.elapsed_time || 0;
            const hours = Math.floor(timeSecs / 3600);
            const mins = Math.floor((timeSecs % 3600) / 60);
            const secs = timeSecs % 60;
            const hr = activity.average_heartrate > 0 ? Math.round(activity.average_heartrate) + ' bpm' : '--';
            const power = activity.average_watts > 0 ? Math.round(activity.average_watts) + ' w' : '--';
            const elev = activity.total_elevation_gain > 0 ? Math.round(activity.total_elevation_gain * 3.28084) + ' ft' : '--';
            
            let timeStr = '--';
            if (timeSecs > 0) {
                timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m ${secs}s`;
            }

            let paceStr = '--';
            let paceLabel = 'Pace';
            
            if (distanceMiles > 0 && timeSecs > 0) {
                if (activity.type.includes('Ride') || activity.type.includes('VirtualRide')) {
                    paceLabel = 'Speed';
                    const mph = distanceMiles / (timeSecs / 3600);
                    paceStr = `${mph.toFixed(1)} mph`;
                } else if (activity.type.includes('Swim')) {
                    const yds = raw.distance * 1.09361;
                    const pace100 = timeSecs / (yds / 100);
                    const pMins = Math.floor(pace100 / 60);
                    const pSecs = Math.floor(pace100 % 60);
                    paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /100y`;
                } else {
                    const paceSecs = timeSecs / distanceMiles;
                    const pMins = Math.floor(paceSecs / 60);
                    const pSecs = Math.floor(paceSecs % 60);
                    paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /mi`;
                }
            }

            // Build Sidebar Item
            const listItem = document.createElement('div');
            listItem.className = 'activity-item';
            listItem.id = `sidebar-item-${activity.id}`; 
            listItem.setAttribute('data-type', activity.type);
            listItem.setAttribute('data-id', String(activity.id)); 
            
            const searchString = `${activity.name} ${activity.type} ${activity.year}`.toLowerCase();
            listItem.setAttribute('data-search', searchString);
            
            listItem.innerHTML = `
                <h4 style="margin: 0 0 5px 0;">
                    <a href="https://intervals.icu/activities/${activity.id}" target="_blank" onclick="event.stopPropagation();" style="text-decoration: none; color: #0066ff;">
                        ${activity.name} ↗
                    </a>
                </h4>
                <p style="margin: 0 0 5px 0; font-size: 12px; color: #555;">${activity.type} | ${dateStr}</p>
                
                <div class="activity-stats">
                    <div class="stat-box">
                        <span class="stat-label">Distance</span>
                        <strong>${distStr}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Time</span>
                        <strong>${timeStr}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">${paceLabel}</span>
                        <strong>${paceStr}</strong>
                    </div>
                </div>

                <div class="extended-stats" style="display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc;">
                    <div class="activity-stats">
                        <div class="stat-box">
                            <span class="stat-label">Avg HR</span>
                            <strong>${hr}</strong>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Avg Power</span>
                            <strong>${power}</strong>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Elevation</span>
                            <strong>${elev}</strong>
                        </div>
                    </div>
                </div>
            `;

            // Click to zoom map AND expand stats
            listItem.onclick = () => {
                map.fitBounds(line.getBounds(), { padding: [50, 50] });
                
                document.querySelectorAll('.extended-stats').forEach(el => {
                    el.style.display = 'none';
                });
                
                listItem.querySelector('.extended-stats').style.display = 'block';
            };
            
            // Hover to highlight on map
            listItem.addEventListener('mouseenter', () => {
                line.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                line.bringToFront(); 
            });

            listItem.addEventListener('mouseleave', () => {
                const currentConfig = getSportConfig(activity.type);
                line.setStyle({ color: currentConfig.color, weight: 4, opacity: 0.3 });
            });
            listContainer.appendChild(listItem);
        });

        drawTileGrid(); 

        if (allPolylines.length > 0) {
            const group = L.featureGroup(allPolylines);
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
        filterSidebar();
    }

    // ==========================================
    // 5. FILTERING
    // ==========================================

    // Debounce utility to prevent UI blocking on every keystroke when typing in the search box
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    const debouncedFilterSidebar = debounce(filterSidebar, 300);

    // Refresh map state when changing the year
    function filterMapByYear() {
        loadData(document.getElementById('year-select').value);
    }

    // 1. If a user clicks a broad category, uncheck all specific sports
    function resetDropdownAndFilter() {
        document.querySelectorAll('.specific-type-cb').forEach(cb => cb.checked = false);
        filterSidebar();
    }

    // 2. If a user clicks a specific sport, uncheck all broad categories
    function clearCheckboxesAndFilter() {
        document.getElementById('filter-cycling').checked = false;
        document.getElementById('filter-pavement').checked = false;
        document.getElementById('filter-dirt').checked = false;
        document.getElementById('filter-swim').checked = false;
        document.getElementById('filter-other').checked = false;
        filterSidebar();
    }

    // 3. The Master Filter: Responsible for coordinating all visible elements (map layers and sidebar list)
    function filterSidebar() {
        const query = document.getElementById('search-box').value.toLowerCase();
        
        const specificSports = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        const specificColor = document.getElementById('color-specific').value;
        
        const showCycling = document.getElementById('filter-cycling').checked;
        const showPavement = document.getElementById('filter-pavement').checked;
        const showDirt = document.getElementById('filter-dirt').checked;
        const showSwim = document.getElementById('filter-swim').checked;
        const showOther = document.getElementById('filter-other').checked;

        // A. Filter Map Lines Individually
        runningMapLines.forEach(line => {
            const config = getSportConfig(line.sportType);
            const type = line.sportType;
            const act = line.activityData;
            const activityId = String(act.id);
            
            let isVisible = false;

            // Map Cluster Override (If a cluster is clicked, ONLY show those lines)
            if (selectedActivityIds !== null) {
                isVisible = selectedActivityIds.includes(activityId);
                
                // Maintain correct colors for the isolated lines
                if (isVisible && specificSports.length > 0 && specificSports.includes(type)) {
                     line.setStyle({ color: specificColor });
                } else if (isVisible) {
                     line.setStyle({ color: config.color });
                }
            } else {
                // Normal Search & Checkbox Logic
                // Generate the exact same search string used by the sidebar
                const searchString = `${act.name} ${act.type} ${act.year}`.toLowerCase();
                const matchesSearch = searchString.includes(query);
                
                let matchesType = false;

                if (specificSports.length > 0) {
                    // Check if the exact specific sport matches
                    matchesType = specificSports.includes(type);
                    if (matchesType) {
                        line.setStyle({ color: specificColor });
                    }
                } else {
                    // Revert to broad category coloring
                    line.setStyle({ color: config.color });
                    
                    // Check against broad category filters
                    if (type.includes('Ride') || type.includes('VirtualRide') || type.includes('EBike')) matchesType = showCycling;
                    else if (type === 'Run' || type === 'Walk') matchesType = showPavement;
                    else if (type === 'Hike' || type === 'TrailRun') matchesType = showDirt;
                    else if (type.includes('Swim')) matchesType = showSwim;
                    else matchesType = showOther;
                }
                
                isVisible = matchesSearch && matchesType;
            }

            // Physically add or remove the line from the map
            if (isVisible) {
                if (!config.group.hasLayer(line)) config.group.addLayer(line);
            } else {
                if (config.group.hasLayer(line)) config.group.removeLayer(line);
            }
        });

        // B. Filter Sidebar Items
        const items = document.querySelectorAll('.activity-item');
        items.forEach(item => {
            const activityId = String(item.getAttribute('data-id')); 
            
            // Map Cluster Override mode for sidebar
            if (selectedActivityIds !== null) {
                if (selectedActivityIds.includes(activityId)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
                return; 
            }

            const text = item.getAttribute('data-search'); 
            const type = item.getAttribute('data-type');
            const matchesSearch = text.includes(query);
            
            let matchesType = false;
            
            if (specificSports.length > 0) {
                matchesType = specificSports.includes(type);
            } else {
                if (type.includes('Ride') || type.includes('VirtualRide') || type.includes('EBike')) matchesType = showCycling;
                else if (type === 'Run' || type === 'Walk') matchesType = showPavement;
                else if (type === 'Hike' || type === 'TrailRun') matchesType = showDirt;
                else if (type.includes('Swim')) matchesType = showSwim;
                else matchesType = showOther;
            }

            if (matchesSearch && matchesType) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        }); 
    }

    function toggleFilters() {
        const container = document.getElementById('filter-container');
        const icon = document.getElementById('filter-icon');
        
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'flex';
            icon.textContent = '▲';
        } else {
            container.style.display = 'none';
            icon.textContent = '▼';
        }
    }

    function toggleTiles() {
        const showTiles = document.getElementById('filter-tiles').checked;
        if (showTiles) {
            map.addLayer(gridLayerGroup);
        } else {
            map.removeLayer(gridLayerGroup);
        }
    }

    function updateSportColor(baseType, newColor) {
        runningMapLines.forEach(line => {
            let match = false;
            const t = line.sportType;
            
            if (baseType === 'Cycling' && (t.includes('Ride') || t.includes('VirtualRide') || t.includes('EBike'))) match = true;
            else if (baseType === 'Pavement' && (t === 'Run' || t === 'Walk')) match = true;
            else if (baseType === 'Dirt' && (t === 'Hike' || t === 'TrailRun')) match = true;
            else if (baseType === 'Swim' && t.includes('Swim')) match = true;
            else if (baseType === 'Other' && !t.includes('Ride') && !t.includes('VirtualRide') && !t.includes('EBike') && t !== 'Run' && t !== 'Walk' && t !== 'Hike' && t !== 'TrailRun' && !t.includes('Swim')) match = true;
            
            if (match) {
                line.setStyle({ color: newColor }); 
            }
        });
    }

    function updateSpecificSportColor(newColor) {
        const specificSports = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        
        if (specificSports.length > 0) {
            runningMapLines.forEach(line => {
                if (specificSports.includes(line.sportType)) {
                    line.setStyle({ color: newColor });
                }
            });
        }
    }
</script>
