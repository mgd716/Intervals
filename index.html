
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }

        #sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            z-index: 1000; /* Keeps it above the Leaflet map */
        }

        .sidebar-header {
            padding: 15px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
        }
        /* NEW: Filter Button Styling */
        #filter-toggle-btn {
            width: 100%;
            padding: 8px 12px;
            margin-top: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        #filter-toggle-btn:hover {
            background-color: #e9ecef;
        }

        /* UPDATE: Hide the filters by default */
        .sport-filters {
            display: none; /* Changed from flex */
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 13px;
            color: #444;
        }
        #search-box, #year-select {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .sport-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
            color: #444;
        }

        .sport-filters label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        #activity-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .activity-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .activity-item:hover {
            background: #e9ecef;
        }

        .activity-item h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #333;
        }

        .activity-item p {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #555;
        }

        .activity-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #222;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="map"></div>
    
   <div class="sidebar-header">
            <select id="year-select" onchange="filterMapByYear()">
                <option value="ALL">Show All Years</option>
            </select>
            
            <input type="text" id="search-box" placeholder="Search activities..." onkeyup="filterSidebar()">
            
            <!-- NEW: The Toggle Button -->
            <button id="filter-toggle-btn" onclick="toggleFilters()">
                Map Filters <span id="filter-icon">▼</span>
            </button>
            
            <!-- We added the ID 'filter-container' to this div -->
            <div class="sport-filters" id="filter-container">
                <label><input type="checkbox" id="filter-ride" value="Ride" checked onchange="filterSidebar()"> Cycling</label>
                <label><input type="checkbox" id="filter-run" value="Run" checked onchange="filterSidebar()"> Running</label>
                <label><input type="checkbox" id="filter-swim" value="Swim" onchange="filterSidebar()"> Swimming</label>
                <label><input type="checkbox" id="filter-other" value="Other" onchange="filterSidebar()"> Other</label>
                
                <div style="width: 100%; height: 1px; background: #ddd; margin: 5px 0;"></div>
                
                <label><input type="checkbox" id="filter-squadrats" onchange="drawTileGrid()"> Squadrats (14)</label>
                <label><input type="checkbox" id="filter-squadratinhos" onchange="drawTileGrid()"> Squadratinhos (17)</label>
            </div>
        </div>
        
        <div id="activity-list"></div>
    </div>
</div>

<!-- Leaflet & Supabase JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://tmtqyawzmmjfydxoymry.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cMso9XTCykk7W2BYWxAGPw_xzxHCufa';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // ==========================================
    // 2. MAP SETUP
    // ==========================================
    const map = L.map('map').setView([42.8864, -78.8784], 10); // Defaulting near Buffalo
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    window.sportGroups = {
        Ride: L.featureGroup().addTo(map),
        Run: L.featureGroup().addTo(map),
        Swim: L.featureGroup().addTo(map),
        Other: L.featureGroup().addTo(map)
    };

    let gridLayerGroup = L.featureGroup().addTo(map);
    let runningMapLines = [];
    const visitedTiles = new Set();

    function getSportConfig(type) {
        if (type.includes('Ride') || type.includes('VirtualRide')) return { color: '#fc4c02', group: window.sportGroups.Ride }; // Strava Orange
        if (type.includes('Run')) return { color: '#007fb6', group: window.sportGroups.Run };
        if (type.includes('Swim')) return { color: '#00b300', group: window.sportGroups.Swim };
        return { color: '#666666', group: window.sportGroups.Other };
    }


    // ==========================================
    // 3. TILE GRID LOGIC
    // ==========================================
    function drawGridForZoom(targetZoom, bounds, baseColor) {
        const nwPoint = map.project(bounds.getNorthWest(), targetZoom);
        const sePoint = map.project(bounds.getSouthEast(), targetZoom);
        
        const minX = Math.floor(nwPoint.x / 256);
        const maxX = Math.floor(sePoint.x / 256);
        const minY = Math.floor(nwPoint.y / 256);
        const maxY = Math.floor(sePoint.y / 256);

        // SAFETY LIMIT: Prevent browser crash if zoomed out too far
        // If the screen requires more than 3,000 tiles, abort drawing this layer
        const totalTiles = (maxX - minX + 1) * (maxY - minY + 1);
        if (totalTiles > 3000) {
            console.log(`Skipping zoom ${targetZoom} grid: too many tiles (${totalTiles}). Zoom in closer!`);
            return; 
        }

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                const tileNw = map.unproject(L.point(x * 256, y * 256), targetZoom);
                const tileSe = map.unproject(L.point((x + 1) * 256, (y + 1) * 256), targetZoom);
                
                const tileKey = `${targetZoom}_${x}_${y}`;
                const isVisited = visitedTiles.has(tileKey);

                // 'interactive: false' speeds up Leaflet because it stops listening for clicks on the tiles
                const currentStyle = { color: baseColor, weight: 1, fillOpacity: 0, interactive: false };
                if (isVisited) {
                    currentStyle.fillColor = baseColor;
                    currentStyle.fillOpacity = 0.4;
                }
                
                L.rectangle(L.latLngBounds(tileNw, tileSe), currentStyle).addTo(gridLayerGroup);
            }
        }
    }

    function drawTileGrid() {
        gridLayerGroup.clearLayers();
        const bounds = map.getBounds();

        const show14 = document.getElementById('filter-squadrats').checked;
        const show17 = document.getElementById('filter-squadratinhos').checked;

        // Draw Zoom 14 in Orange
        if (show14) {
            drawGridForZoom(14, bounds, "#ff7800"); 
        }
        
        // Draw Zoom 17 in Blue
        if (show17) {
            drawGridForZoom(17, bounds, "#0066ff"); 
        }
    }

    map.on('moveend', drawTileGrid);


    // ==========================================
    // 4. DATA LOADING & UI
    // ==========================================
    
    // 1. Safely load ALL years for the dropdown by paginating
    async function initDropdown() {
        let allYears = [];
        let start = 0;
        const chunkSize = 1000;

        while (true) {
            const { data, error } = await _supabase.from('activities').select('year').range(start, start + chunkSize - 1);
            if (error || !data || data.length === 0) break;
            
            allYears.push(...data.map(item => item.year));
            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        // Remove duplicates and sort newest to oldest
        const uniqueYears = [...new Set(allYears)].sort((a, b) => b - a);
        const dropdown = document.getElementById('year-select');
        
        uniqueYears.forEach(year => {
            if (year > 0) {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                dropdown.appendChild(opt);
            }
        });
        
        // Trigger the initial map load
        loadData("ALL");
    }
    
    initDropdown(); // Kick off the process when the page loads

    // 2. Safely load ALL map data by paginating
    async function loadData(targetYear) {
        runningMapLines.forEach(line => line.remove());
        runningMapLines = [];
        visitedTiles.clear();
        
        const listContainer = document.getElementById('activity-list');
        listContainer.innerHTML = '';
        
        let activities = [];
        let start = 0;
        const chunkSize = 1000;

        // Loop until every row is downloaded
        while (true) {
            let query = _supabase.from('activities').select('*').range(start, start + chunkSize - 1);
            if (targetYear !== "ALL") {
                query = query.eq('year', parseInt(targetYear));
            }

            const { data, error } = await query;
            if (error) { console.error("Database query failed:", error); break; }
            if (!data || data.length === 0) break;

            activities.push(...data);
            
            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        const allPolylines = [];

        activities.forEach(activity => {
            if (!activity.coordinates || activity.coordinates.length === 0) return;

            // Load pre-calculated tiles from the database
            if (activity.visited_tiles) {
                activity.visited_tiles.forEach(tile => visitedTiles.add(tile));
            }

            // Draw Line
            const config = getSportConfig(activity.type);
            const line = L.polyline(activity.coordinates, {
                color: config.color,
                weight: 3,
                opacity: 0.8,
                smoothFactor: 0
            });

            line.bindPopup(`<a href="https://intervals.icu/activities/${activity.id}" target="_blank" style="text-decoration: none; color: #0066ff;"><strong>${activity.name}</strong></a>`);
            line.addTo(config.group);
            
            runningMapLines.push(line);
            allPolylines.push(line);

            // Calculate Sidebar Metrics
            const raw = activity.raw_data || {};
            const distanceMiles = raw.distance ? (raw.distance / 1609.34) : 0;
            const distStr = distanceMiles > 0 ? distanceMiles.toFixed(2) + ' mi' : '--';

            const timeSecs = raw.moving_time || raw.elapsed_time || 0;
            const hours = Math.floor(timeSecs / 3600);
            const mins = Math.floor((timeSecs % 3600) / 60);
            const secs = timeSecs % 60;
            
            let timeStr = '--';
            if (timeSecs > 0) {
                timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m ${secs}s`;
            }

            let paceStr = '--';
            let paceLabel = 'Pace';
            
            if (distanceMiles > 0 && timeSecs > 0) {
                if (activity.type.includes('Ride') || activity.type.includes('VirtualRide')) {
                    paceLabel = 'Speed';
                    const mph = distanceMiles / (timeSecs / 3600);
                    paceStr = `${mph.toFixed(1)} mph`;
                } else if (activity.type.includes('Swim')) {
                    const yds = raw.distance * 1.09361;
                    const pace100 = timeSecs / (yds / 100);
                    const pMins = Math.floor(pace100 / 60);
                    const pSecs = Math.floor(pace100 % 60);
                    paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /100y`;
                } else {
                    const paceSecs = timeSecs / distanceMiles;
                    const pMins = Math.floor(paceSecs / 60);
                    const pSecs = Math.floor(paceSecs % 60);
                    paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /mi`;
                }
            }

            // Build Sidebar Item
            const listItem = document.createElement('div');
            listItem.className = 'activity-item';
            listItem.setAttribute('data-type', activity.type);
            
            listItem.innerHTML = `
                <h4>${activity.name}</h4>
                <p>${activity.type} | ${activity.year}</p>
                <div class="activity-stats">
                    <div class="stat-box">
                        <span class="stat-label">Distance</span>
                        <strong>${distStr}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Time</span>
                        <strong>${timeStr}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">${paceLabel}</span>
                        <strong>${paceStr}</strong>
                    </div>
                </div>
            `;

            listItem.onclick = () => {
                map.fitBounds(line.getBounds(), { padding: [50, 50] });
                line.openPopup();
            };

            listContainer.appendChild(listItem);
        });

        drawTileGrid(); 

        if (allPolylines.length > 0) {
            const group = L.featureGroup(allPolylines);
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
    }
    // ==========================================
    // 5. FILTERING
    // ==========================================
    function filterMapByYear() {
        loadData(document.getElementById('year-select').value);
    }

    function filterSidebar() {
        const query = document.getElementById('search-box').value.toLowerCase();
        
        const showRide = document.getElementById('filter-ride').checked;
        const showRun = document.getElementById('filter-run').checked;
        const showSwim = document.getElementById('filter-swim').checked;
        const showOther = document.getElementById('filter-other').checked;

        if (showRide) map.addLayer(window.sportGroups.Ride); else map.removeLayer(window.sportGroups.Ride);
        if (showRun) map.addLayer(window.sportGroups.Run); else map.removeLayer(window.sportGroups.Run);
        if (showSwim) map.addLayer(window.sportGroups.Swim); else map.removeLayer(window.sportGroups.Swim);
        if (showOther) map.addLayer(window.sportGroups.Other); else map.removeLayer(window.sportGroups.Other);

        const items = document.querySelectorAll('.activity-item');
        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            const type = item.getAttribute('data-type');

            const matchesSearch = text.includes(query);

            let matchesType = true;
            if (type.includes('Ride') || type.includes('VirtualRide')) matchesType = showRide;
            else if (type.includes('Run')) matchesType = showRun;
            else if (type.includes('Swim')) matchesType = showSwim;
            else matchesType = showOther;

            if (matchesSearch && matchesType) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    }
    function toggleFilters() {
        const container = document.getElementById('filter-container');
        const icon = document.getElementById('filter-icon');
        
        // If it's hidden, show it using flexbox. If it's showing, hide it.
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'flex';
            icon.textContent = '▲';
        } else {
            container.style.display = 'none';
            icon.textContent = '▼';
        }
    }
    function toggleTiles() {
        const showTiles = document.getElementById('filter-tiles').checked;
        
        if (showTiles) {
            map.addLayer(gridLayerGroup);
        } else {
            map.removeLayer(gridLayerGroup);
        }
    }
</script>

</body>
</html>
