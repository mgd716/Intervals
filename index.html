<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Map</title>

    <!-- Security: Added Content-Security-Policy to mitigate XSS and prevent unauthorized data exfiltration -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://tmtqyawzmmjfydxoymry.supabase.co;">
    <!-- Security: Control referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
   
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Forces the mouse to pass straight through the popup */
        .ghost-popup {
            pointer-events: none !important;
        }

        /* Reset default margins and set full height for the page layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Main application wrapper, using flexbox to position map and sidebar side-by-side */
        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* The Leaflet map container, flex-grow allows it to take up remaining space */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Fixed-width sidebar for controls and activity list */
        #sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            z-index: 1000; /* Keeps it above the Leaflet map */
        }

        /* Sidebar header containing filters and search, pinned to the top */
        .sidebar-header {
            padding: 10px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0; /* Prevents the header from getting crushed when the list is long */
        }
        
        /* Button to toggle the visibility of map filters */
        #filter-toggle-btn {
            width: 100%;
            padding: 8px 12px;
            margin-top: 5px;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        #filter-toggle-btn:hover {
            background-color: #e9ecef;
        }
        
        /* Row layout for individual filter checkboxes and color pickers */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        /* Grid layout for category filters to be side-by-side */
        .category-filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            gap: 5px;
        }

        /* Minimal styling for color pickers */
        .filter-row input[type="color"] {
            border: none;
            width: 20px;
            height: 24px;
            padding: 0;
            cursor: pointer;
            background: transparent;
        }
        
        /* Container for all sport-specific filters (hidden by default) */
        .sport-filters {
            display: none; 
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-size: 13px;
            color: #444;
        }
        
        /* Container for side-by-side dropdowns */
        .dropdown-row {
            display: flex;
            gap: 5px;
            width: 100%;
            margin-top: 5px;
        }

        /* Styling for text search box and dropdowns */
        #search-box, #year-select, #sort-select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #search-box {
            margin-top: 5px;
        }

        /* Keyboard navigation focus styles */
        #search-box:focus-visible,
        #year-select:focus-visible,
        #sort-select:focus-visible,
        #sort-dir-btn:focus-visible,
        #filter-toggle-btn:focus-visible,
        input[type="color"]:focus-visible,
        input[type="checkbox"]:focus-visible,
        .activity-item:focus-visible,
        #clear-filters-btn:focus-visible {
            outline: 2px solid #0066ff;
            outline-offset: 2px;
        }

        /* Label alignment for filter checkboxes */
        .sport-filters label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* Scrollable container for the list of activities */
        #activity-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        /* Individual activity card styling */
        .activity-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .activity-item:hover {
            background: #e9ecef;
        }

        /* Activity title */
        .activity-item h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #333;
        }

        /* Activity type and date subtitle */
        .activity-item p {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #555;
        }

        /* Layout for primary activity stats (distance, time, pace) */
        .activity-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #222;
        }

        /* Container for a single stat label and value */
        .stat-box {
            display: flex;
            flex-direction: column;
        }

        /* Label for an individual stat */
        .stat-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
    /* Consistent sizing and alignment for SVG sport icons in the sidebar list */
        .sport-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
            display: inline-block;
        }
        /* Start and End Markers */
        .start-marker {
            background-color: #00ff00;
            border: 2px solid black;
            border-radius: 50%;
            width: 12px !important;
            height: 12px !important;
            margin-left: -6px !important;
            margin-top: -6px !important;
            box-sizing: border-box;
        }

        .end-marker {
            background-color: white;
            background-image:
                linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black),
                linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black);
            background-size: 6px 6px;
            background-position: 0 0, 3px 3px;
            border: 2px solid black;
            border-radius: 50%;
            width: 14px !important;
            height: 14px !important;
            margin-left: -7px !important;
            margin-top: -7px !important;
            box-sizing: border-box;
        }

        /* ==========================================
           MOBILE RESPONSIVENESS
           ========================================== */
        @media (max-width: 768px) {
            #app-container {
                flex-direction: column;
                height: 100dvh; 
            }
            
            #map {
                width: 100%;
                flex: 0 0 50%; 
            }

            #sidebar {
                width: 100%;
                flex: 1; 
                height: auto; 
                border-left: none;
                border-top: 2px solid #ccc;
                overflow: hidden; 
            }
        }
    </style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>

<script>
    // Helper to sanitize untrusted input to prevent XSS
    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://tmtqyawzmmjfydxoymry.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cMso9XTCykk7W2BYWxAGPw_xzxHCufa';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Popup configuration used for hover clusters (non-interactive)
    const clusterPopup = L.popup({ 
        autoPan: false, 
        closeButton: false, 
        className: 'ghost-popup',
        offset: [0, -15] 
    });

    // ==========================================
    // 2. MAP SETUP
    // ==========================================
    // Initialize Leaflet map, centered roughly on Buffalo, NY
    const map = L.map('map').setView([42.8864, -78.8784], 10); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);

    // Grouping layers by sport category for easy batch toggling
    window.sportGroups = {
        Cycling: L.featureGroup().addTo(map), 
        Pavement: L.featureGroup().addTo(map),
        Dirt: L.featureGroup().addTo(map),
        Swim: L.featureGroup().addTo(map),
        Other: L.featureGroup().addTo(map)
    };

    let gridLayerGroup = L.featureGroup().addTo(map);
    let runningMapLines = [];
    const visitedTiles = new Set();

    // ==========================================
    // CLUSTER TRACKING & HIGHLIGHTING
    // ==========================================
    // State variables for managing selected and highlighted lines
    let selectedActivityIds = null; 
    let highlightedLines = []; 
    let activeActivityId = null; // NEW: Track the currently active activity highlight

    // State variables for start and end markers
    let currentStartMarker = null;
    let currentEndMarker = null;

    function clearStartEndMarkers() {
        if (currentStartMarker) {
            map.removeLayer(currentStartMarker);
            currentStartMarker = null;
        }
        if (currentEndMarker) {
            map.removeLayer(currentEndMarker);
            currentEndMarker = null;
        }
    }
    
    // NEW HELPER: Reverts a line to its proper specific or category color
    function resetLineStyle(l) {
        if (!l || !l.activityData) return;
        const specificSports = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        const specificColor = document.getElementById('color-specific').value;
        
        const type = l.activityData.type;
        let restoreColor = getSportConfig(type).color;
        
        // If this sport is selected in the specific list, restore to the custom color instead
        if (specificSports.length > 0 && specificSports.includes(type)) {
            restoreColor = specificColor;
        }
        
        l.setStyle({ color: restoreColor, weight: 4, opacity: 0.30 });
    }

   // Resets the map styling for any lines that were currently highlighted
   function clearMapHighlights() {
        highlightedLines.forEach(l => {
            // NEW: Skip resetting if this line is the active clicked activity
            if (activeActivityId && l.activityData.id === activeActivityId) return;
            resetLineStyle(l);
        });
        highlightedLines = []; 
    }

    // Map click handler to select a specific cluster of lines
    map.on('click', function(e) {
        // Find lines within a short pixel distance from the click
        const cluster = getOverlappingLines(e.latlng, 15);
        
        clearStartEndMarkers();
        
        // NEW: Unhighlight previously active line when map is clicked
        if (activeActivityId) {
            const prevLine = runningMapLines.find(l => l.activityData.id === activeActivityId);
            resetLineStyle(prevLine);
            activeActivityId = null;
        }

        if (cluster.length > 0) {
            // Isolate map to show only clicked activities
            selectedActivityIds = cluster.map(l => String(l.activityData.id));
            document.getElementById('search-box').placeholder = `Filtered to ${cluster.length} activities (Click empty map to clear)`;
            
            // Scroll to the top of the sidebar
            document.getElementById('activity-list').scrollTop = 0;
            
            // Expand the extended stats section for clicked activities in the sidebar
            document.querySelectorAll('.extended-stats').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.activity-item').forEach(el => el.setAttribute('aria-expanded', 'false'));
            selectedActivityIds.forEach(id => {
                const card = document.getElementById(`sidebar-item-${id}`);
                if (card) {
                    card.querySelector('.extended-stats').style.display = 'block';
                    card.setAttribute('aria-expanded', 'true');
                }
            });
            
        } else {
            // If click is empty, reset view to all activities
            selectedActivityIds = null;
            document.getElementById('search-box').placeholder = "Search activities... (Press '/')";
        }
        // Apply the new visual state
        filterSidebar();
    });
    
    function getSportConfig(type) {
        // Safety guard prevents the map from crashing if an activity has no type
        if (!type) type = 'Other'; 

        if (type.includes('Ride') || type.includes('VirtualRide') || type.includes('EBike')) return { color: document.getElementById('color-cycling').value, group: window.sportGroups.Cycling, category: 'Cycling' };
        if (type === 'Run' || type === 'Walk') return { color: document.getElementById('color-pavement').value, group: window.sportGroups.Pavement, category: 'Pavement' };
        if (type === 'Hike' || type === 'TrailRun') return { color: document.getElementById('color-dirt').value, group: window.sportGroups.Dirt, category: 'Dirt' };
        if (type.includes('Swim')) return { color: document.getElementById('color-swim').value, group: window.sportGroups.Swim, category: 'Swim' };
        
        return { color: document.getElementById('color-other').value, group: window.sportGroups.Other, category: 'Other' };
    }
    
    // Maps a specific sport type string to its corresponding category color and layer group
   function getSportIcon(type) {
       if (!type) type = 'Other';
       let iconId = 'icon-fallback';

        if (type.includes('EBike')) iconId = 'icon-ebike';
        else if (type.includes('Ride') || type.includes('VirtualRide')) iconId = 'icon-ride';
        else if (type.includes('NordicSki') || type.includes('BackcountrySki')) iconId = 'icon-ski-nordic';
        else if (type.includes('Ski') || type.includes('Snowboard')) iconId = 'icon-ski';
        else if (type.includes('Kayak') || type.includes('Row')) iconId = 'icon-boat';
        else if (type === 'Tennis') iconId = 'icon-tennis';
        else if (type === 'Hike') iconId = 'icon-hike';
        else if (type === 'TrailRun') iconId = 'icon-trailrun';
        else if (type === 'Run') iconId = 'icon-run';
        else if (type === 'Golf') iconId = 'icon-golf';
        else if (type === 'Walk') iconId = 'icon-walk';
        else if (type.includes('Swim')) iconId = 'icon-swim';
        
        return `<svg class="sport-icon"><use href="#${iconId}"></use></svg>`;
    }

    // ==========================================
    // 3. TILE GRID LOGIC
    // ==========================================
    function drawGridForZoom(targetZoom, bounds, baseColor) {
        if (map.getZoom() < 10) return;
        const nwPoint = map.project(bounds.getNorthWest(), targetZoom);
        const sePoint = map.project(bounds.getSouthEast(), targetZoom);
        
        const minX = Math.floor(nwPoint.x / 256);
        const maxX = Math.floor(sePoint.x / 256);
        const minY = Math.floor(nwPoint.y / 256);
        const maxY = Math.floor(sePoint.y / 256);

        const totalTiles = (maxX - minX + 1) * (maxY - minY + 1);
        if (totalTiles > 5000) {
            return; 
        }

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                const tileNw = map.unproject(L.point(x * 256, y * 256), targetZoom);
                const tileSe = map.unproject(L.point((x + 1) * 256, (y + 1) * 256), targetZoom);
                
                const tileKey = `${targetZoom}_${x}_${y}`;
                const isVisited = visitedTiles.has(tileKey);

                const currentStyle = { 
                    color: baseColor, 
                    weight: 1, 
                    opacity: 0.3,      
                    fillOpacity: 0, 
                    interactive: false 
                };

                if (isVisited) {
                    currentStyle.fillColor = baseColor;
                    currentStyle.fillOpacity = 0.2; 
                }
                
                L.rectangle(L.latLngBounds(tileNw, tileSe), currentStyle).addTo(gridLayerGroup);
            }
        }
    }

    function drawTileGrid() {
        gridLayerGroup.clearLayers();
        const bounds = map.getBounds();

        const show14 = document.getElementById('filter-squadrats').checked;
        const show17 = document.getElementById('filter-squadratinhos').checked;

        if (show14) {
            drawGridForZoom(14, bounds, "#ff7800"); 
        }
        if (show17) {
            drawGridForZoom(17, bounds, "#0066ff"); 
        }
    }

    map.on('moveend', drawTileGrid);

    // ==========================================
    // 4. DATA LOADING & UI
    // ==========================================

    // SPATIAL SEARCH: Given a lat/lng, find all lines on the map that intersect within a specific pixel tolerance
    function getOverlappingLines(latlng, tolerancePixels = 10) {
        // Project map coordinates into pixels for distance calculation
        const point = map.project(latlng);
        const matches = [];
        
        // ⚡ Bolt Optimization: Pre-calculate a bounding box around the click
        // to fast-fail intersection checks without creating new padded bounds for every line
        const clickBounds = L.latLngBounds(
            [latlng.lat - 0.01, latlng.lng - 0.01],
            [latlng.lat + 0.01, latlng.lng + 0.01]
        );

        runningMapLines.forEach(line => {
            if (!map.hasLayer(line)) return; 
            
            // Fast bounding box check to exclude lines far away
            const bounds = line.getBounds();
            if (!bounds.isValid() || !clickBounds.intersects(bounds)) return;
            
            // Detailed segment-by-segment check if inside bounding box
            const coords = line.getLatLngs();
            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = map.project(coords[i]);
                const p2 = map.project(coords[i+1]);
                if (L.LineUtil.pointToSegmentDistance(point, p1, p2) <= tolerancePixels) {
                    matches.push(line);
                    break; 
                }
            }
        });
        return matches;
    }
    
    // Fetch unique years from Supabase to populate the filtering dropdown
    async function initDropdown() {
        let allYears = [];
        let start = 0;
        const chunkSize = 1000;

        while (true) {
            const { data, error } = await _supabase.from('activities').select('year').range(start, start + chunkSize - 1);
            if (error || !data || data.length === 0) break;
            
            allYears.push(...data.map(item => item.year));
            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        const uniqueYears = [...new Set(allYears)].sort((a, b) => b - a);
        const dropdown = document.getElementById('year-select');
        
        uniqueYears.forEach(year => {
            if (year > 0) {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                dropdown.appendChild(opt);
            }
        });
        
        loadData("ALL");
    }
    
    // Safely load ALL map data
    async function loadData(targetYear) {
        // Show loading state
        document.getElementById('loading-state').style.display = 'block';
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('activity-list').style.display = 'none';
        document.getElementById('sidebar').setAttribute('aria-busy', 'true');

        // Yield to event loop so browser paints loading state
        await new Promise(resolve => setTimeout(resolve, 0));

        runningMapLines.forEach(line => line.remove());
        runningMapLines = [];
        visitedTiles.clear();
        
        const listContainer = document.getElementById('activity-list');
        listContainer.innerHTML = '';
        
        let start = 0;
        const chunkSize = 1000;
        let uniqueTypesSet = new Set();
        let isFirstBatch = true;

        const specificListContainer = document.getElementById('specific-sport-list');
        specificListContainer.innerHTML = '';

        while (true) {
            // Sort directly in the database
            // ⚡ Bolt Optimization: Querying native columns (distance, moving_time, elapsed_time) instead of JSONB parsing (raw_data->distance)
            // speeds up the database query (from ~450ms to ~250ms per 100 items limit test) by avoiding runtime JSON evaluation.
            let query = _supabase.from('activities')
                .select('id, name, type, start_date, year, coordinates, visited_tiles, average_heartrate, average_watts, total_elevation_gain, distance, moving_time, elapsed_time')
                .order('start_date', { ascending: false, nullsFirst: false })
                .range(start, start + chunkSize - 1);

            if (targetYear !== "ALL") {
                query = query.eq('year', parseInt(targetYear));
            }

            const { data, error } = await query;
            if (error) { console.error("Database query failed:", error); break; }
            if (!data || data.length === 0) break;

            data.forEach(activity => {
                if (activity.type) {
                    uniqueTypesSet.add(activity.type);
                }
            });

            // Immediately process and render the new batch of data
            processAndRenderBatch(data);
            
            if (isFirstBatch) {
                if (runningMapLines.length > 0) {
                    const group = L.featureGroup(runningMapLines);
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }
                isFirstBatch = false;
            }

            if (data.length < chunkSize) break;
            start += chunkSize;
        }

        sortActivities();
        filterSidebar();

        // =========================================================
        // BUILD DYNAMIC SCROLLABLE CHECKBOXES
        // Populate the Specific Sport Override filter box with all discovered types
        // =========================================================
        const uniqueTypes = [...uniqueTypesSet].sort();
        specificListContainer.innerHTML = ''; 

        uniqueTypes.forEach(type => {
            const lbl = document.createElement('label');
            lbl.style.display = 'block'; 
            lbl.style.marginBottom = '4px';
            lbl.style.cursor = 'pointer';
            
            const safeType = escapeHTML(type);
            // Safe to inject because we just escaped 'type'
            lbl.innerHTML = `<input type="checkbox" class="specific-type-cb" value="${safeType}" onchange="clearCheckboxesAndFilter()"> ${safeType}`;
            specificListContainer.appendChild(lbl);
        });
        // =========================================================

        drawTileGrid();

        // Hide loading state and show content
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('activity-list').style.display = 'block';
        document.getElementById('sidebar').setAttribute('aria-busy', 'false');
    }

    // Extracted logic to process and render a single batch of activities

    function createMapLine(activity, config) {
        const line = L.polyline(activity.coordinates, {
            color: config.color,
            weight: 4,
            opacity: 0.3,
            smoothFactor: 1
        });
        line.sportType = activity.type;
        line.sportCategory = config.category;
        line.activityData = activity;
        return line;
    }

    function calculateActivityMetrics(activity) {
        const rawDistanceMeters = activity.distance || 0;
        const distanceMiles = rawDistanceMeters ? (rawDistanceMeters / 1609.34) : 0;
        const distStr = distanceMiles > 0 ? distanceMiles.toFixed(2) + ' mi' : '--';

        const timeSecs = activity.moving_time || activity.elapsed_time || 0;
        const hours = Math.floor(timeSecs / 3600);
        const mins = Math.floor((timeSecs % 3600) / 60);
        const secs = timeSecs % 60;
        let timeStr = '--';
        if (timeSecs > 0) {
            timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m ${secs}s`;
        }

        const hr = activity.average_heartrate > 0 ? Math.round(activity.average_heartrate) + ' bpm' : '--';
        const power = activity.average_watts > 0 ? Math.round(activity.average_watts) + ' w' : '--';
        const elev = activity.total_elevation_gain > 0 ? Math.round(activity.total_elevation_gain * 3.28084) + ' ft' : '--';

        let paceStr = '--';
        let paceLabel = 'Pace';

        if (distanceMiles > 0 && timeSecs > 0) {
            if (activity.type.includes('Ride') || activity.type.includes('VirtualRide')) {
                paceLabel = 'Speed';
                const mph = distanceMiles / (timeSecs / 3600);
                paceStr = `${mph.toFixed(1)} mph`;
            } else if (activity.type.includes('Swim')) {
                const yds = rawDistanceMeters * 1.09361;
                const pace100 = timeSecs / (yds / 100);
                const pMins = Math.floor(pace100 / 60);
                const pSecs = Math.floor(pace100 % 60);
                paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /100y`;
            } else {
                const paceSecs = timeSecs / distanceMiles;
                const pMins = Math.floor(paceSecs / 60);
                const pSecs = Math.floor(paceSecs % 60);
                paceStr = `${pMins}:${pSecs.toString().padStart(2, '0')} /mi`;
            }
        }

        // Speed for sorting in descending order, raw meters per second (m/s = m / s)
        const speedMs = timeSecs > 0 ? rawDistanceMeters / timeSecs : 0;

        return { rawDistanceMeters, distanceMiles, distStr, timeSecs, timeStr, hr, power, elev, paceStr, paceLabel, speedMs };
    }

    function createSidebarItem(activity, dateStr, metrics) {
        const listItem = document.createElement('div');
        listItem.className = 'activity-item';
        listItem.id = `sidebar-item-${activity.id}`;
        listItem.setAttribute('data-type', activity.type);
        listItem.setAttribute('data-id', String(activity.id));
        listItem.setAttribute('role', 'button');
        listItem.setAttribute('tabindex', '0');
        const safeId = escapeHTML(activity.id);
        const safeName = escapeHTML(activity.name);
        const safeType = escapeHTML(activity.type);

        listItem.setAttribute('aria-expanded', 'false');
        listItem.setAttribute('aria-controls', `extended-stats-${safeId}`);

        const searchString = `${activity.name} ${activity.type} ${activity.year}`.toLowerCase();
        listItem.setAttribute('data-search', searchString);

        listItem.setAttribute('data-date', activity.start_date || activity.year);
        listItem.setAttribute('data-distance', metrics.distanceMiles);
        listItem.setAttribute('data-time', metrics.timeSecs);
        listItem.setAttribute('data-speed', metrics.speedMs);

        listItem.innerHTML = `
            <h4 style="margin: 0 0 5px 0;">
                <a href="https://intervals.icu/activities/${safeId}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" style="text-decoration: none; color: #0066ff;">
                    ${safeName} ↗
                </a>
            </h4>
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #555;">${getSportIcon(activity.type)} ${safeType} | ${dateStr}</p>

            <div class="activity-stats">
                <div class="stat-box">
                    <span class="stat-label">Distance</span>
                    <strong>${metrics.distStr}</strong>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Time</span>
                    <strong>${metrics.timeStr}</strong>
                </div>
                <div class="stat-box">
                    <span class="stat-label">${metrics.paceLabel}</span>
                    <strong>${metrics.paceStr}</strong>
                </div>
            </div>

            <div id="extended-stats-${safeId}" class="extended-stats" style="display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc;">
                <div class="activity-stats">
                    <div class="stat-box">
                        <span class="stat-label">Avg HR</span>
                        <strong>${metrics.hr}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Avg Power</span>
                        <strong>${metrics.power}</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Elevation</span>
                        <strong>${metrics.elev}</strong>
                    </div>
                </div>
            </div>
        `;

        return listItem;
    }

    function processAndRenderBatch(activities) {
        const listContainer = document.getElementById('activity-list');
        const fragment = document.createDocumentFragment();

        activities.forEach(activity => {
            if (activity.type === 'VirtualRide') return;
            if (!activity.coordinates || activity.coordinates.length === 0) return;

            if (activity.visited_tiles) {
                activity.visited_tiles.forEach(tile => visitedTiles.add(tile));
            }

            const config = getSportConfig(activity.type);
            const line = createMapLine(activity, config);
            line.addTo(config.group);

            let dateStr = activity.year;
            if (activity.start_date) {
                const d = new Date(activity.start_date);
                dateStr = d.toLocaleDateString(undefined, { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
            }

            // CLUSTER HOVER
            line.on('mouseover', function (e) {
                clearMapHighlights(); 
                
                const cluster = getOverlappingLines(e.latlng, 10);
                cluster.sort((a, b) => new Date(b.activityData.start_date || b.activityData.year) - new Date(a.activityData.start_date || a.activityData.year));
                
                let html = '<div style="font-family: Arial; text-align: left; max-height: 200px; overflow-y: auto;">';
                
                cluster.forEach((l, index) => {
                    l.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                    l.bringToFront();
                    highlightedLines.push(l); 
                    
                    if (index < 5) {
                        const act = l.activityData;
                        const dStr = act.start_date ? new Date(act.start_date).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric', year: 'numeric' }) : act.year;
                        const safeActId = escapeHTML(act.id);
                        const safeActName = escapeHTML(act.name);
                        
                        html += `<div style="margin-bottom: 3px;">
                                    <a href="https://intervals.icu/activities/${safeActId}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: #333; font-size: 13px;">
                                        ${safeActName} (${dStr})
                                    </a>
                                 </div>`;
                    }
                });
                
                if (cluster.length > 5) {
                    html += `<div style="font-size: 11px; color: #888; margin-top: 4px;">... and ${cluster.length - 5} more</div>`;
                }
                html += '</div>';
                
                clusterPopup.setLatLng(e.latlng).setContent(html).openOn(map);
            });

            // UN-HOVER
            line.on('mouseout', function () {
                clearMapHighlights();
            });
                 
            runningMapLines.push(line);

            // Pre-calculate search string to avoid re-evaluating in loops during filtering
            activity.searchString = `${activity.name} ${activity.type} ${activity.year}`.toLowerCase();

            const metrics = calculateActivityMetrics(activity);
            const listItem = createSidebarItem(activity, dateStr, metrics);

            // Attach DOM element reference to the map line for O(1) lookups during filtering
            line.sidebarItem = listItem;

            // Click to zoom map AND expand stats
            listItem.onclick = () => {
                clearStartEndMarkers();
                
                // NEW: Revert the style of the previously active line (if any)
                if (activeActivityId) {
                    const prevLine = runningMapLines.find(l => l.activityData.id === activeActivityId);
                    resetLineStyle(prevLine);
                }
            
                // NEW: Set this activity as the actively selected one
                activeActivityId = activity.id;

                map.fitBounds(line.getBounds(), { padding: [50, 50] });
                
                document.querySelectorAll('.extended-stats').forEach(el => {
                    el.style.display = 'none';
                });
                document.querySelectorAll('.activity-item').forEach(el => el.setAttribute('aria-expanded', 'false'));
                
                listItem.querySelector('.extended-stats').style.display = 'block';
                listItem.setAttribute('aria-expanded', 'true');

                // Add start and end markers
                if (activity.coordinates && activity.coordinates.length > 0) {
                    const startCoord = activity.coordinates[0];
                    const endCoord = activity.coordinates[activity.coordinates.length - 1];

                    const startIcon = L.divIcon({ className: 'start-marker' });
                    const endIcon = L.divIcon({ className: 'end-marker' });

                    currentStartMarker = L.marker(startCoord, { icon: startIcon, interactive: false }).addTo(map);
                    currentEndMarker = L.marker(endCoord, { icon: endIcon, interactive: false }).addTo(map);
                }
                
                // NEW: Force the highlight to stay active
                line.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                line.bringToFront();
            };
            
            // Keyboard event listener for accessibility
            listItem.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    listItem.click();
                }
            });

            // Hover to highlight on map
            listItem.addEventListener('mouseenter', () => {
                line.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                line.bringToFront(); 
            });

            listItem.addEventListener('mouseleave', () => {
                // NEW: If this is the active activity, don't remove the highlight!
                if (activeActivityId === activity.id) return;
                resetLineStyle(line);
            });

            // Focus to highlight on map (for keyboard users)
            listItem.addEventListener('focus', () => {
                line.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                line.bringToFront();
            });

            listItem.addEventListener('blur', () => {
                if (activeActivityId === activity.id) return;
                resetLineStyle(line);
            });

            fragment.appendChild(listItem);
        });

        listContainer.appendChild(fragment);
    }

    // Initial Load
    initDropdown();

    // ==========================================
    // 5. FILTERING & SORTING
    // ==========================================

    let isSortAscending = false;

    function toggleSortDirection() {
        isSortAscending = !isSortAscending;

        // Visual indicator could be added here if desired,
        // e.g. rotating the icon or changing its background
        const btn = document.getElementById('sort-dir-btn');
        if (isSortAscending) {
            btn.style.background = '#e9ecef';
        } else {
            btn.style.background = 'white';
        }

        sortActivities();
    }

    function onSortSelectChange() {
        // Reset to descending by default when changing sort type
        isSortAscending = false;
        document.getElementById('sort-dir-btn').style.background = 'white';
        sortActivities();
    }

    function sortActivities() {
        const listContainer = document.getElementById('activity-list');
        // ⚡ Bolt Optimization: NodeList children is much faster than querySelectorAll
        const items = Array.from(listContainer.children);
        const sortType = document.getElementById('sort-select').value;

        // ⚡ Bolt Optimization: Map the values once (Schwartzian transform) to avoid
        // slow DOM attribute reads and float/date parsing during every sort comparison
        const mapped = items.map(item => {
            let val;
            if (sortType === 'date') {
                val = new Date(item.getAttribute('data-date')).getTime();
            } else if (sortType === 'distance') {
                val = parseFloat(item.getAttribute('data-distance')) || 0;
            } else if (sortType === 'time') {
                val = parseFloat(item.getAttribute('data-time')) || 0;
            } else if (sortType === 'pace') {
                val = parseFloat(item.getAttribute('data-speed')) || 0;
            }
            return { value: val, element: item };
        });

        mapped.sort((a, b) => {
            let result = b.value - a.value;
            return isSortAscending ? -result : result;
        });

        // ⚡ Bolt Optimization: Use DocumentFragment to batch DOM inserts and avoid reflows
        const fragment = document.createDocumentFragment();
        mapped.forEach(item => fragment.appendChild(item.element));
        listContainer.appendChild(fragment);

        // Ensure the SVG arrow icon rotates to reflect the direction
        // By default (descending), the user wants the icon pointing down (scaleY(-1))
        // When ascending, it returns to normal (none).
        const btn = document.getElementById('sort-dir-btn');
        if (btn) {
            const svg = btn.querySelector('svg');
            if (svg) {
                svg.style.transform = isSortAscending ? 'none' : 'scaleY(-1)';
            }
        }
    }

    // Debounce utility to prevent UI blocking on every keystroke when typing in the search box
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    const debouncedFilterSidebar = debounce(filterSidebar, 300);

    // Refresh map state when changing the year
    function filterMapByYear() {
        loadData(document.getElementById('year-select').value);
    }

    function clearFilters() {
        document.getElementById('search-box').value = '';
        selectedActivityIds = null;
        document.getElementById('year-select').value = 'ALL';

        document.getElementById('filter-cycling').checked = true;
        document.getElementById('filter-pavement').checked = true;
        document.getElementById('filter-dirt').checked = true;
        document.getElementById('filter-swim').checked = true;
        document.getElementById('filter-other').checked = true;

        document.querySelectorAll('.specific-type-cb').forEach(cb => cb.checked = false);

        filterSidebar();
        loadData("ALL");
    }

    // 1. If a user clicks a broad category, uncheck all specific sports
    function resetDropdownAndFilter() {
        document.querySelectorAll('.specific-type-cb').forEach(cb => cb.checked = false);
        filterSidebar();
    }

    // 2. If a user clicks a specific sport, uncheck all broad categories
    function clearCheckboxesAndFilter() {
        document.getElementById('filter-cycling').checked = false;
        document.getElementById('filter-pavement').checked = false;
        document.getElementById('filter-dirt').checked = false;
        document.getElementById('filter-swim').checked = false;
        document.getElementById('filter-other').checked = false;
        filterSidebar();
    }

    // 3. The Master Filter: Responsible for coordinating all visible elements (map layers and sidebar list)
    function filterSidebar() {
        const query = document.getElementById('search-box').value.toLowerCase();
        
        const specificSportsArr = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        const specificSportsSet = specificSportsArr.length > 0 ? new Set(specificSportsArr) : null;
        const specificColor = document.getElementById('color-specific').value;
        
        const categoryVisibility = {
            Cycling: document.getElementById('filter-cycling').checked,
            Pavement: document.getElementById('filter-pavement').checked,
            Dirt: document.getElementById('filter-dirt').checked,
            Swim: document.getElementById('filter-swim').checked,
            Other: document.getElementById('filter-other').checked
        };

        const configs = {
            Cycling: { color: document.getElementById('color-cycling').value, group: window.sportGroups.Cycling },
            Pavement: { color: document.getElementById('color-pavement').value, group: window.sportGroups.Pavement },
            Dirt: { color: document.getElementById('color-dirt').value, group: window.sportGroups.Dirt },
            Swim: { color: document.getElementById('color-swim').value, group: window.sportGroups.Swim },
            Other: { color: document.getElementById('color-other').value, group: window.sportGroups.Other }
        };

        let visibleCount = 0;

        // Unified loop for Map Lines and Sidebar Items
        runningMapLines.forEach(line => {
            const config = configs[line.sportCategory];
            const type = line.sportType;
            const act = line.activityData;
            const activityId = String(act.id);
            const item = line.sidebarItem;
            
            let isVisible = false;
            let itemIsVisible = false;

            // NEW: Unified helper to apply style, respecting the active highlight lock
            // ⚡ Bolt Optimization: Only call setStyle if properties have actually changed
            // to avoid expensive Leaflet SVG redraws on every filter keystroke.
            const applyStyle = (baseColor) => {
                if (activeActivityId === act.id) {
                    if (line.options.color !== '#ffff00' || line.options.weight !== 6) {
                        line.setStyle({ color: '#ffff00', weight: 6, opacity: 1 });
                    }
                } else {
                    if (line.options.color !== baseColor || line.options.weight !== 4) {
                        line.setStyle({ color: baseColor, weight: 4, opacity: 0.3 });
                    }
                }
            };

            // Map Cluster Override (If a cluster is clicked, ONLY show those lines)
            if (selectedActivityIds !== null) {
                isVisible = selectedActivityIds.includes(activityId);
                itemIsVisible = isVisible; // Sidebar logic matches map cluster exactly
                
                // Maintain correct colors for the isolated lines
                if (isVisible && specificSportsSet !== null && specificSportsSet.has(type)) {
                     applyStyle(specificColor);
                } else if (isVisible) {
                     applyStyle(config.color);
                }
            } else {
                // Normal Search & Checkbox Logic
                // Use pre-calculated search string to avoid re-evaluating in loops
                const searchString = act.searchString || `${act.name} ${act.type} ${act.year}`.toLowerCase();
                // ⚡ Bolt Optimization: skip string evaluation if query is empty
                const matchesSearch = query === '' || searchString.includes(query);
                
                let matchesType = false;

                if (specificSportsSet !== null) {
                    // Check if the exact specific sport matches
                    matchesType = specificSportsSet.has(type);
                    if (matchesType) applyStyle(specificColor);
                } else {
                    applyStyle(config.color);
                    // Check against broad category filters
                    matchesType = categoryVisibility[line.sportCategory];
                }
                
                isVisible = matchesSearch && matchesType;
                itemIsVisible = isVisible;
            }

            // Physically add or remove the line from the map
            if (isVisible) {
                if (!config.group.hasLayer(line)) config.group.addLayer(line);
            } else {
                if (config.group.hasLayer(line)) config.group.removeLayer(line);
            }
            
            // Toggle sidebar item visibility via stored reference
            // ⚡ Bolt Optimization: Only update DOM display style if it's actually changing
            // to prevent browser layout thrashing.
            if (item) {
                if (itemIsVisible) {
                    if (item.style.display !== 'block') item.style.display = 'block';
                    visibleCount++;
                } else {
                    if (item.style.display !== 'none') item.style.display = 'none';
                }
            }
        });

        // Toggle Empty State UI
        const emptyState = document.getElementById('empty-state');
        if (emptyState) {
            if (visibleCount === 0 && runningMapLines.length > 0) {
                if (emptyState.style.display !== 'block') emptyState.style.display = 'block';
            } else {
                if (emptyState.style.display !== 'none') emptyState.style.display = 'none';
            }
        }
    }

    function toggleFilters() {
        const container = document.getElementById('filter-container');
        const icon = document.getElementById('filter-icon');
        const btn = document.getElementById('filter-toggle-btn');
        
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'flex';
            icon.textContent = '▲';
            btn.setAttribute('aria-expanded', 'true');
        } else {
            container.style.display = 'none';
            icon.textContent = '▼';
            btn.setAttribute('aria-expanded', 'false');
        }
    }

    function updateSportColor(baseType, newColor) {
        runningMapLines.forEach(line => {
            let match = false;
            const t = line.sportType;
            
            if (baseType === 'Cycling' && (t.includes('Ride') || t.includes('VirtualRide') || t.includes('EBike'))) match = true;
            else if (baseType === 'Pavement' && (t === 'Run' || t === 'Walk')) match = true;
            else if (baseType === 'Dirt' && (t === 'Hike' || t === 'TrailRun')) match = true;
            else if (baseType === 'Swim' && t.includes('Swim')) match = true;
            else if (baseType === 'Other' && !t.includes('Ride') && !t.includes('VirtualRide') && !t.includes('EBike') && t !== 'Run' && t !== 'Walk' && t !== 'Hike' && t !== 'TrailRun' && !t.includes('Swim')) match = true;
            
            // NEW: Ensure we don't accidentally override the currently active yellow highlight
            if (match && activeActivityId !== line.activityData.id) {
                line.setStyle({ color: newColor }); 
            }
        });
    }

    function updateSpecificSportColor(newColor) {
        const specificSports = Array.from(document.querySelectorAll('.specific-type-cb:checked')).map(cb => cb.value);
        
        if (specificSports.length > 0) {
            runningMapLines.forEach(line => {
                // NEW: Ensure we don't accidentally override the currently active yellow highlight
                if (specificSports.includes(line.sportType) && activeActivityId !== line.activityData.id) {
                    line.setStyle({ color: newColor });
                }
            });
        }
    }

    // Global keyboard shortcut for search box
    document.addEventListener('keydown', (e) => {
        if (e.key === '/') {
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
                e.preventDefault();
                document.getElementById('search-box').focus();
            }
        }
    });
</script>
